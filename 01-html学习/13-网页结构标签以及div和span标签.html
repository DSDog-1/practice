<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页结构标签以及div和span标签</title>
</head>
<body>
  <h2>
    网页结构标签
  </h2>
  <header>网页头部标签</header>
  <nav>导航栏标签</nav>
  <main>网页主体标签
    <aside>侧边栏标签</aside>
    <article>文章标签</article>
  </main>
  <footer>网页底部标签</footer>
  <section>区块标签</section>
  <h2>
    div标签和span标签
  </h2>
  <div>
    这是一个div标签
    自动换行大模块
  </div>
    <div>
    这是一个div标签
    自动换行大模块
  </div>
  <span>
    这是一个span标签
    不自动换行小模块
  </span>
    <span>
    这是一个span标签
    不自动换行小模块
  </span>
</body>
</html>
