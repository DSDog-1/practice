<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css样式表分类</title>
  <style>
    div{
      color: blue;
    }
    strong{
      color: red;
    }
  </style>
</head>
<body>
  <!-- 1.内联样式表 写标签内部，控制当前标签-->
   <p style="color: pink;">粉色</p>
  <!-- 2.内部样式表 写head标签中，控制当前页面-->
   <div>蓝色</div>
   <strong>红色</strong>
</body>
</html>
