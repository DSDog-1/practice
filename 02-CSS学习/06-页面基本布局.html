<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面基本布局</title>
  <style>
    /* 清除外边距 */
    * {
      margin: 0;
      padding: 0;
    }
    .header {
      height: 80px;
      background-color: black;
    }
    .nav {
      width: 1000px;/* w1000 */
      height: 60px;/* h60 */
      background-color: skyblue;
    }
    .main {
      width: 1000px;
      height: 1000px;
      background-color: pink;
    }
    .footer {
      height: 150px;
      background-color: purple;
    }
    /*让块级盒子水平居中*/
    .conter {
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <!-- 头部内容.header -->
  <div class="header"></div>
  <!-- 导航栏内容.nav -->
  <div class="nav conter"></div>
  <!-- 主体内容.main -->
  <div class="main conter"></div>
  <!-- 页脚内容.footer -->
  <div class="footer"></div>
</body>
</html>
