<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>font简写和继承性</title>
  <style>
  body {
    font: 14px "宋体";
    font: italic 700 14px/30px "宋体";
  }
  div {
    color: red;
  }
  p {
    color: blue;
  }
  
  </style>
</head>
<body>
  <div>
    <p>这是一个段落</p>
  </div>
</body>
</html>
