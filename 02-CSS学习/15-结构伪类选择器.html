<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结构伪类选择器</title>
  <style>
    /* 选择第一个小li */
    .ul1 li:first-child {
      color: red;
    }
    /* 选择最后一个小li */
    .ul1 li:last-child {
      color: blue;
    }
    /* 选择第5个li */
    .ul1 li:nth-child(5) {
      color: green;
    }

    /* 选择奇数个li */
    .ul2 li:nth-child(odd) {
      color: blue;
    }
    /* 选择偶数个li */
    .ul2 li:nth-child(even) {
      color: red;
    }
    /* 公式n=0开始 */
    .ul2 li:nth-child(3n) {
      color: pink;
    }
    /* 3的倍数3n 第2个及其以后的元素n+2 前面三个元素-n+3 */
  </style>
</head>
<body>
  <ul class="ul1">
    <li>111</li>
    <li>222</li>
    <li>333</li>
    <li>444</li>
    <li>555</li>
    <li>666</li>
    <li>777</li>
    <li>888</li>
    <li>999</li>
    <li>1000</li>
  </ul>
  <ul class="ul2">
    <li>111</li>
    <li>222</li>
    <li>333</li>
    <li>444</li>
    <li>555</li>
    <li>666</li>
    <li>777</li>
    <li>888</li>
    <li>999</li>
    <li>1000</li>
  </ul>
</body>
</html>
