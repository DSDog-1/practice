<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单伪类选择器</title>
  <style>
    button {
      width: 150px;
      height: 40px;
      background-color: #ff6900;
      color: #fff;
      font-size: 14px;
      /* 去掉边框 */
      border: none;
    }

    /*表单禁用状态*/
    button:disabled {
      /* 透明度 */
      opacity: .4;
    }
    /* 表单选中状态 */
    input:checked+label {
    color: #ff6900;
    }
  </style>
</head>
<body>
  <button disabled>注册</button>
  <br>
  <input type="checkbox" id="agree">
  <label for="agree">同意协议</label>
</body>
</html>
