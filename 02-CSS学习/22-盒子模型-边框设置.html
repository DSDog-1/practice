<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盒子模型-边框设置</title>
  <style>
    div[class*=box]{
      width: 200px;
      height: 200px;
      margin: 20px;
    }
    .box1 {
      border: 10px solid red;
    }
    .box2 {
      border: 10px dashed red;
    }
    .box3 {
      border: 10px dotted red;
    }
    .box4 {
      border-top: 10px solid #000;
      border-bottom: 10px dashed red;
      border-left: 10px dotted green;
      border-right: 10px double blue;
    }
    .box5 {
      border: 5px solid #d9e0ee;
      border-top: 5px solid red;
    }
    h2 {
      border-bottom: 5px solid red;
     }
  </style>
</head>
<body>
  <div class="box1">实线边框</div>
  <div class="box2">虚线边框</div>  
  <div class="box3">点线边框</div>
  <div class="box4">不同边框1</div>
  <div class="box5">不同边框2</div>
  <h2>单边框</h2>
</body>
</html>
