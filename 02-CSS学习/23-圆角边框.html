<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圆角边框</title>
  <style>
    .radius1 {
     width: 200px;
     height: 80px;
     background-color: pink;
     border-radius: 10px;
    }
    .radius2 {
      width: 200px;
      height: 200px;
      background-color: pink;
      border-radius: 100px;
      /* 圆形圆角为方形宽度一半或50% */
    }
     .radius3 {
      width: 200px;
      height: 40px;
      background-color: skyblue;
      border-radius: 20px;
      /* 胶囊按钮圆角为较小值的一半 */
     }
     .jia {
      border-radius: 50%;
     }
     .radius5 {
      width: 100px;
      height: 100px;
      background-color: pink;
      border-radius: 10px;
     }
     .radius6 {
      width: 100px;
      height: 100px;
      background-color: orange;
      border-radius: 10px 20px;
     }
     .radius7 {
      width: 100px;
      height: 100px;
      background-color: red;
      border-radius: 10px 0 30px;
     }
     .radius8 {
      width: 100px;
      height: 100px;
      background-color: green;
      border-radius: 0 20px 40px 50px;
     }
     .ren {
      border-radius: 10px 0;
      border: 2px solid red;
      /* 圆形圆角为方形宽度一半或50% */
     }
      </style>
</head>
<body>
  <div class="radius1"></div>
  <div class="radius2"></div>
  <div class="radius3">胶囊按钮</div>
  <div class="radius4"></div>
  <img src="./img/w1.webp" alt="" class="jia">
  <div class="radius5">一个值</div>
  <div class="radius6">两个值</div>
  <div class="radius7">三个值</div>
  <div class="radius8">四个值</div>
  <img src="./img/w3.webp" alt="" class="ren">
</body>
</html>
