<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盒子模型-内边距</title>
  <style>
    .box1 {
      width: 200px;
      height: 200px;
      background-color: pink;
      padding: 10px 20px;/* 内边距顺时针上 右 下 左未赋值时与对边相等 */
    }
    .title {
      width: 240px;
      height: 35px;
      border: 1px solid #d9d9d9;
      border-top: 3px solid #FF8400;
      line-height: 35px;/* 垂直居中 */
      padding-left: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box1">一个值上下左右，两个值上下 左右，三个值上 右左 下，四个值上 右 下 左，</div>
  <hr>
  <div class="title">美妆时尚热榜</div>
</body>
</html>
