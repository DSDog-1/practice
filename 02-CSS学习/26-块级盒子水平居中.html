<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>块级盒子水平居中</title>
  <style>
    [class^="box"] {
      width: 150px;
      height: 150px;
      background-color: pink;
    }
    .box1 {
      margin: 0 auto;
    }
    .box2 {
      margin: auto;
    }
    .box3 {
      margin-left: auto;
      margin-right: auto;
    }
    div {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
  <div class="box3"></div>
  <div><span>行内盒子</span></div>
</body>
</html>
