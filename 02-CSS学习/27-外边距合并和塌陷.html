<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外边距合并和塌陷</title>
  <style>
    .box1,
    .box2 {
      width: 150px;
      height: 100px;
      background-color: pink;
    }
    .box1 {
    margin-bottom: 100px;/* 外边距合并为100px */
    }
    .box2 {
    margin-top: 50px;
     background-color: skyblue;
    }

    .father {
      width: 150px;
      height: 150px;
      background-color: purple;
      /* border: 1px solid red;1. 父盒子有上边框 */
      /* padding-top: 0.1px;2. 父盒子有上内边距 */
      overflow: hidden;

    }
    .son {
      width: 80px;
      height: 80px;
      background-color: pink;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
  <div class="father">
    <div class="son"></div>
  </div>
</body>
</html>
