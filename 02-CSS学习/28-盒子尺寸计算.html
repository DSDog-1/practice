<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盒子尺寸计算</title>
  <style>
    .box1 {
      width: 150px;
      height: 100px;
      background-color: pink;
      box-sizing: content-box;/* 默认，width=内容宽度 */
      padding: 20px;
      border: 10px solid red;
    }
    .box2 {
      width: 150px;
      height: 100px;
      background-color: pink;
      box-sizing: border-box;/* width=内容宽度+padding+border */
      padding: 20px;
      border: 10px solid red;
    }
  </style>
</head>
<body>
  <div class="box1">content-box</div>
  <div class="box2">border-box</div>
</body>
</html>
