<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS初始化</title>  
  <style>
    /* 简单重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* 列表项默认样式 */
    ul,ol {
      list-style: none;
    }
    /* 链接默认样式 */
    a {
      text-decoration: none;
    }
    /* input默认样式 */
    input {
      outline: none;
    }
    
  </style>
</head>
<body>
  <ul>
    <li>列表项1</li>
    <li>列表项2</li>
    <li>列表项3</li>
  </ul>
</body>
</html>
