<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小米卡片</title> 
  <style>
    /* 初始化 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ccc;
    }
    .card {
      width: 234px;
      height: 300px;
      background-color: #fff;
      margin: 100px auto;/* 居中 */
      text-align: center;/* 内容物都水平居中 */
      transition: all 0.4s;/* 过渡效果 */
    }
    .card:hover {
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }
    .card img {
      width: 160px;
      margin-top: 20px;/* 非块级盒子不会塌陷 */
    }
    .card h3 {
      font-size: 14px;
      font-weight: 400;
      color: #333;
      margin-top: 18px;
    }
    .card p.desc {
      font-size: 12px;
      color: #b0b0b0;
      padding: 0 10px;
      overflow: hidden;/* 隐藏超出部分 */
      text-overflow: ellipsis;/* 超出部分省略号 */
      white-space: nowrap;/* 不换行 */
    }
    .card .price {
      font-size: 14px;
      color: #b0b0b0;
      margin-top: 10px;
    }
    .card .price span {
      color: #ff6700;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./img/mi.webp" alt="">
    <h3 class="title">Xiaomi Buds 5</h3>
    <p class="desc">舒适无感佩戴 | 高通全链路 | 哈曼 AudioEFX 联合调音
    </p>
    <p class="price">
      <span>659元</span>
      <del>699元</del>
    </p>
  </div>
