<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display显示模式转换</title>  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    ul,
    li {
      list-style: none;
    }
    a {
      text-decoration: none;
    }
    .subbar {
      width: 234px;
      height: 468px;
      background-color: #9d9b9b;
      margin: 100px auto ;
      padding: 20px 0;
      font-size: 14px;
    }
    .subbar ul a {
      /* 把链接转换为块级元素 */
      display: block;
      height: 42px;
      line-height: 42px;
      color: #fff;
      padding-left: 20px;
    }
    .subbar ul a:hover {
      background-color: #ff5000;
    }
    .list {
      width: 400px;
      height: 400px;
      border: 1px solid #ff5000;
      margin: 0 auto;
    }
    .list a {
        /* 把链接转换为行内块元素 */
      display: inline-block;
      height: 30px;
      line-height: 30px;
      color: #fff;
      background-color: #ccc;
      border-radius: 5px;
      font-size: 12px;
      padding: 0 15px;
      margin: 5px;
    }
    .box {
      /* 清除列表项之间的间距 */
        font-size: 0;
    }
    .box li {
      /* 把列表转换为行内块元素 */
      display: inline-block;
      width: 200px;
      height: 300px;
      background-color: pink;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="subbar">
    <ul>
      <li><a href="#">手机</a></li>
      <li><a href="#">平板</a></li>
      <li><a href="#">笔记本</a></li>
      <li><a href="#">智能音箱</a></li>
      <li><a href="#">智能电视</a></li>
    </ul>
  </div>
  <div class="box">
    <ul>
      <li>11111111111</li>
      <li>222222222222</li>
      <li>333333333333</li>
      <li>444444444444</li>
    </ul>
  </div>
  <div class="list">
    <a href="#">商品列表</a>
    <a href="#">商品列表</a>
    <a href="#">商品列表</a>
    <a href="#">商品列表</a>
    <a href="#">商品列表</a>
  </div>
</body>
</html>
