<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浮动</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    ul,
    li {
      list-style: none;
    }
    .box {
      width: 600px;
      height: 500px;
      border: 1px solid #ff5000;
      margin: 0 auto;
    }
    .box li {
      /* 添加浮动 */
      float: left;
      width: 190px;
      height: 200px;
      margin-right: 15px;
      margin-bottom: 15px;
    }
    .box li:nth-child(odd) {
      background-color: pink;
    }
    .box li:nth-child(even) {
      background-color: skyblue;
    }
    .box li:nth-child(3n) {
      margin-right: 0;
    }
  </style>
</head>
<body>
  <ul class="box">
    <li>111111</li>
    <li>222222</li>
    <li>333333</li>
    <li>444444</li>
    <li>555555</li>
    <li>666666</li>
    <li>777777</li>
    <li>888888</li>
    <li>999999</li>
  </ul>
</body>
</html>
