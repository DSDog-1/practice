<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹性布局-flex项目伸缩尺寸</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .box {
      width: 80%;
      border: 1px solid #ff5000;
      margin: 0 auto;
      display: flex;
      gap: 10px;/* 子盒子之间的间距 */
    }
    .box .item {
      width: 88px;
      height: 100px;
      background-color: pink;
      flex: 1;/* 优先执行flex属性 */
      /* 把父盒子的剩余空间平均分为几等份，一个子盒子占1份，来填满父盒子 */
      /* margin-right: 10px; */
    }
    .box .item:nth-child(odd) { 
      background-color: purple;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
  </div>
</body>
</html>
