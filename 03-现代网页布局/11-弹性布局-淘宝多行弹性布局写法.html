<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淘宝多行弹性布局写法</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .w {
      width: 80%;
      margin: 20px auto;
    }
    .bix {
      border: 1px solid #ff5000;
      display: flex;
      flex-wrap: wrap;
      margin-left: -8px;
      margin-right: -8px;
    }
    .bix .item {
      /* width: 80px; */
      /* flex: 1; */
      flex: 0 0 16.6666666%;/* 多行伸缩尺寸 */
      height: 120px;
      /* background-color: pink; */
      margin-bottom: 16px;
      padding: 0 8px;
    }
    .bix .item .content {
      width: 100%;
      height: 100%;
      background-color: red;
    }
    .footer {
      width: 80%;
      height: 120px;
      background-color: black;
      margin: 0 auto;
    }
  </style>
</head>
<body>
<div class="w">
    <div class="bix">
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>

    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>

    <div class="item">
      <div class="content"></div>
    </div>

    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
    <div class="item">
      <div class="content"></div>
    </div>
  </div>
</div>
  <div class="footer"></div>
</body>
</html>
