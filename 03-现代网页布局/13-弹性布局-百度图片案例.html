  <title>百度图片案例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .col-flex {
      width: 1180px;
      /* border: 1px solid #ff5000; */
      margin: 20px auto;
      display: flex;
      gap: 16px;
    }
    .col-flex .item {
      flex: 1;
    }
    .col-flex .item a {
      display: block;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;/* 隐藏超出部分 */
      margin-bottom: 15px;
    }
    .col-flex .item a img {
      width: 100%;
      /* display: block; */
      vertical-align: top;/* 垂直对齐 */
    }
  </style>
</head>
