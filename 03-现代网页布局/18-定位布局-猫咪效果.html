<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫咪效果</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    ol,
    ul {
      list-style: none;
    }
    .box {
      overflow: hidden;
      position: relative;
      width: 1000px;
      margin: 100px auto;
    }
    .box::before,
    .box::after {
      position: absolute;/* 绝对定位后可直接设置宽度和高度 */
      left: 0;
      border-radius: 50%;
      content: "";
      width: 100%;
      height: 100px;
      background-color: #fff;
    }
    .box::before {
      top: -50px;
    }
    .box::after {
      bottom: -50px;
    }
    .box ul {
      display: flex;
      gap: 15px;
      /* 水平滚动条 */
      overflow-x: scroll;
      /* 隐藏滚动条 */
      scrollbar-width: none;
      /* 平滑滚动 */
      scroll-behavior: smooth;
    }
    /* 兼容性隐藏滚动条 */
    .box ul::-webkit-scrollbar {
      display: none;
    }
    .box ul li {
      /* width: 200px; */
      flex: 0 0 200px;/* 不压缩 不放大 宽度 */
    }
    .box ul li img {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="box">
    <ul>
      <li><a href="#"><img src="./img/cat1.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat2.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat3.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat4.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat5.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat6.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat7.jpg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat8.jpeg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat9.jpeg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat10.jpeg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat11.jpeg" alt=""></a></li>
      <li><a href="#"><img src="./img/cat12.jpeg" alt=""></a></li> 
    </ul>
  </div>
</body>
</html>
