<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粘性定位</title>
  <style>
    .nav {
      position: sticky;
      top: 0;/* 距离父盒子为0时，固定在顶部 */
      width: 1000px;
      height: 100px;
      background-color: pink;
      margin: 100px auto;
    }
    .main {
      height: 2000px;
      background-color: aquamarine;
    }
  </style>
</head>
<body>
  <nav class="nav">导航部分</nav>
  <main class="main">主要内容部分</main>
</body>
</html>
