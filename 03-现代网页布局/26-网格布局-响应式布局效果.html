<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网格布局-响应式布局效果</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .box {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      max-width: 1350px;/* 最大宽度1350,无最小限制 */
      margin: 30px auto;
      gap: 18px;
    }
    .box video {
      width: 100%;
      height: 100%;
      border-radius: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
    <video src="./img/video.mp4"></video>
  </div>
</body>
</html>
