<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>类型选择器以及注释</title>
  <style>
    div{
      color: pink;
      font-size: 20px;
    }
    li{
      color: red;
      font-size: 20px;
    }
    div{
      color: blue;
    }
    /* 后面覆盖前面 */
  </style>
</head>
<body>
  <div>郭奉孝</div>
  <div>贾文和</div>
  <div>荀文若</div>
  <div>张孟卓</div>
  <ul>
    <li>陈公台</li>
    <li>孔文举</li>
    <li>荀公达</li>
    <li>钟元常</li>
  </ul>
</body>
</html>
