<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语义化页面</title>
</head>
<body>
  <h1>HTML的标题和段落</h1>
  <p>HTML的标题和段落是网页的基本元素，用于组织和展示内容。</p>
  <h2>实现结构层级</h2>
  <p>HTML的标题和段落可以实现结构层级，帮助浏览器和用户理解网页的组织结构。</p>
  <h2>为什么我们需要结构化</h2>
  <p>结构化是指将内容按照一定的层级和顺序组织起来，使用户可以更容易地理解和导航。</p>
  <h2>为什么我们需要语义</h2>
  <p>语义是指将内容按照一定的层级和顺序组织起来，使用户可以更容易地理解和导航。</p>
</body>
</html>
