<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>元素分类</title>
</head>
<body>
  <!-- 块级元素 -->
  <h1>块级元素</h1>
  <p>块级元素</p>
  <P>
    <STRONG>
      加粗文字
    </STRONG>
  </P>
  <!-- 行内元素 -->
  <strong>内联元素</strong>
  <em>内联元素</em>
  <strong>
    <!-- <p>
      内联元素
    </p> -->
  </strong>

  <!-- p里不能包含其他块级元素 -->
</body>
</html>
