<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数组</title>
</head>
<body>
  <script>
    // 数组
    // 1. 声明数组let arr = []
    let arr = ['张三','李四','王五','赵六','钱七']
    // 2. 使用数组元素（数组名[索引]）
    console.log(arr[0])
    // 3. 输出数组长度（数组名.length）
    console.log(arr.length)
  </script>
</body>
</html>
