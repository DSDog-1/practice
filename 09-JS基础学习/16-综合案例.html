<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>综合案例</title>
  <style>
    h2{
      text-align: center;
    }
    table{
      border-collapse: collapse;/* 合并边框 */
      height: 80px;
      margin: 0 auto;
      text-align: center;
    }
    th {
      padding: 5px 30px;
    }
    table,
    th,
    td{
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <h2>订单确认</h2>



  <script>
    // 1. 提示用户输入商品单价和商品数量
    let price = + prompt('请输入商品单价')
    let num = + prompt('请输入商品数量')
    let address = prompt('请输入收货地址')
    // 2. 计算总价
    let total = price * num
    // 3.页面打印渲染
    document.write(`
      <table>
        <tr>
          <th>商品名称</th>
          <th>商品单价</th>
          <th>商品数量</th>
          <th>总价</th>
          <th>收货地址</th>
        </tr>
        <tr>
          <td>商品1</td>
          <td>${price}元</td>
          <td>${num}</td>
          <td>${total}元</td>
          <td>${address}</td>
        </tr>
      </table>
    `)
  </script>
</body>
</html>
