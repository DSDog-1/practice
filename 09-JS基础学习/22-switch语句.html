<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>switch语句</title>
</head>
<body>
  <script>
    switch (1) {
      case 1:
        alert('1')
        break
      case 2:
        alert('2')
        break
      case 3:
        alert('3')
        break
      default:
        alert('其他')
        break
    }
  </script>
</body>
</html>
