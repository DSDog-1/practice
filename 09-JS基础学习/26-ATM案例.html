<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM案例</title>
</head>

<body>
  <script>
    let money = 1000
    while (true) {
      let re = prompt(
        `请输入您的选择：
        1.存款 
        2.取款 
        3.查询余额 
        4.退出`)
      // 退出条件
      if (re === '4') {
        break
      }
      switch (re) {
        case '1':
          let cun = +prompt('请输入存款金额')
          money += cun
          alert(`存款成功，当前余额为${money}`)
          break
        case '2':
          let qu = +prompt('请输入取款金额')
          if (qu <= money) {
            money -= qu
            alert(`取款成功，当前余额为${money}`)
          } else {
            alert('余额不足')
          }
          break
        case '3':
          alert(`当前余额为${money}`)
          break
        default:
          alert('输入错误')
          break
      }
    }
  </script>
</body>

</html>
