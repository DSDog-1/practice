<!DOCTYPE html>

<head>

<body>
  <script>
    // function getMax(x =0, y =0) {
    //   return x > y ? x : y
    // }
    // let max = getMax(10, 20)
    // document.write(max)

    function getArrValue(arr = []){
      let max = arr[0]
      let min = arr[0]
      for (let i = 1;i < arr.length;i++){ 
        if (arr[i] > max){
          max = arr[i]
        }
        if (arr[i] < min){
          min = arr[i]
        }
      }
      return [max, min]
    }
    let newArr = getArrValue([10, 20, 30, 40, 50])
    document.write(`数组的最大值是${newArr[0]}`)
    document.write(`数组的最小值是${newArr[1]}`)
  </script>
</body>
