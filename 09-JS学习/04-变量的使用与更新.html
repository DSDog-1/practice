<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>变量的使用</title>
</head>
<body>
  <script>
    // 声明变量
    let name
    // 赋值（变量名 = 字面量）
    name = '张三'
    // 输出
    console.log(name)
    
    // 声明变量并赋值（let 变量名 = 字面量）
    let age = 18
    // 更新变量值
    age = 20

    // 声明多个变量
    let a = 10,b = 20,c = 30
    // 输出
    console.log(a,b,c)
  </script>
</body>
</html>
