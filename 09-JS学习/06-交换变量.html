<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交换变量</title>
</head>
<body>
  <script>
    // 交换变量
    // 1. 声明变量
    let a = 10
    let b = 20
    // 2. 交换变量值
    let temp = a
    a = b
    b = temp
    // 3. 输出交换后的变量值
    console.log(a,b)
  </script>
</body>
</html>
