<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>输入姓名年龄案例</title>
</head>
<body>
  <script>
    // 输入姓名年龄案例
    // 1. 提示用户输入姓名
    let name = prompt('请输入姓名')
    // 2. 提示用户输入年龄
    let age = prompt('请输入年龄')
    // 3. 提示用户输入性别
    let sex = prompt('请输入性别')
    // 3. 输出姓名、年龄和性别
    document.write(name + '的年龄是' + age + '，性别是' + sex)
  </script>
</body>
</html>
