<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算两个数的和</title>
</head>
<body>
  <script>
    let a = Number(prompt('请输入第一个数'))
    let b = Number(prompt('请输入第二个数'))
    alert(`两个数的和为： ${a + b}`)
  </script>
</body>
</html>
