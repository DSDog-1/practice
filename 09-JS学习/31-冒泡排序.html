<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冒泡排序</title>
</head>
<body>
  <script>
    let arr = [5,4,9,6,1,2,8,7]
    for (let i = 0; i < arr.length - 1; i++) {
      for (let j = 0; j < arr.length - 1 - i; j++) {
        if (arr[j] > arr[j + 1]) {
          let temp = arr[j]
          arr[j] = arr[j + 1]
          arr[j + 1] = temp
        }
      }
    }
    // 数组排序升序
    arr.sort()
    // 数组排序降序
    arr.sort((a, b) => b - a)
    // 数组排序随机
    arr.sort(() => Math.random() - 0.5)
    
    document.write(arr)
  </script>
</body>
</html>
