<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对象的使用</title>
</head>
<body>
  <script>
    // 对象的使用
    let obj = {
      uname: '张三',
      age: 18,
      sex: '男',
      song: function () {
        console.log('我会飞')
      }
    }
    // 查
    console.log(obj.uname)

    
    // 改
    obj.uname = '李四'
    console.log(obj.uname)

    // 增
    obj.sex = '男'
    console.log(obj.sex)

    // 删
    delete obj.sex
    console.log(obj)

    // 查的另一种方式
    console.log(obj['uname'])

    // 调用方法
    obj.song()

    // 遍历
    for (let k in obj) {
      console.log(k)  
      console.log(obj[k])
    }

    // 内置对象-Math
    console.log(Math.PI) // 圆周率
    console.log(Math.round(3.14)) // 四舍五入 3
    console.log(Math.round(-3.5)) // -3
    console.log(Math.round(-3.51)) // -4
    console.log(Math.floor(3.14)) // 向下取整 3
    console.log(Math.ceil(3.14)) // 向上取整 4
    console.log(Math.max(1,2,3,4,5)) // 找最大数 5
    console.log(Math.min(1,2,3,4,5)) // 找最小数 1
    console.log(Math.pow(2,3)) // 幂运算 8
    console.log(Math.abs(-10)) // 绝对值 10
    console.log(Math.random()) // 随机数 0-1之间的随机数[0,1)
    console.log(Math.floor(Math.random() * 100)) // 0-99的随机整数[0,100)
    // console.log(Math.floor(Math.random() * (M - N + 1)) + N) // N - M之间的随机整数 [N,M]
    let arr = ['red','green','blue']
    let random = Math.floor(Math.random() * arr.length)
    console.log(arr[random])
    // 不重复抽取 删掉已抽取的元素
    arr.splice(random, 1)
    console.log(arr)

  </script>
</body>
</html>
