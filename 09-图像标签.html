<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像标签</title>
</head>
<body>
  <h2>
    图像标签的基本使用：
  </h2>
  <img src="miku.png" alt="初音未来">
  <img src="miku1.png" alt="初音未来">
  <h2>
    图像标签属性：
  </h2>
  <img src="miku.png" alt="初音未来" width="300">
  <!-- 一般宽高只修改一个 -->
  <img src="miku.png" alt="初音未来" height="300" title="视奸">
</body>
</html>
