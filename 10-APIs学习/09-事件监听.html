<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件监听</title>
  <style>
    div {
      width: 200px;
      height: 200px;
      background-color: pink;
      margin: 0 auto;
    }
    .list {
      list-style: none;
      display: none;
    }
   </style>
</head>
<body>
  <button>点击我</button>
  <div></div>
  <div class="mi">
    <input type="text">
    <ul class="list">
      <li><a href="#">111111</a></li>
      <li><a href="#">222222</a></li>
      <li><a href="#">333333</a></li> 
      <li><a href="#">444444</a></li> 
    </ul>
  </div>
  <script>
    const btn = document.querySelector('button')
    btn.addEventListener('click', function () { // 点击事件
      console.log('点击了按钮')
    })
    const div = document.querySelector('div')
    div.addEventListener('mouseenter', function () { //  鼠标经过
      console.log('鼠标移入了div')
    })
    div.addEventListener('mouseleave', function () { //  鼠标离开
      console.log('鼠标移出了div')
    })

    const input = document.querySelector('input')
    const list = document.querySelector('.list')
    input.addEventListener('focus', function () {   // 获得焦点事件
      list.style.display = 'block'
    })
    input.addEventListener('blur', function () {   // 失去焦点事件
      list.style.display = 'none'
    })
    input.addEventListener('keydown', function () { // 键盘按下事件
      
    })
    input.addEventListener('keyup', function (e) { // 键盘松开事件
      if (e.key === 'Enter') {
        console.log('按下了Enter键')
      }
    })
    input.addEventListener('input', function () { // 键盘输入事件
      console.log(input.value)
    })



    // 事件对象属性
    // type 获取事件类型
    // clientX/clientY 获取光标相对于浏览器可见窗口左上角的位置
    // offsetX/offsetY 获取光标相对于事件目标元素左上角的位置
    // key 获取键盘按下的键
    // target 事件目标元素
    // currentTarget 事件当前元素
    // eventPhase 事件阶段
    // bubbles 是否冒泡
    // cancelable 是否可取消
    // defaultPrevented 是否已阻止默认行为
    // stopPropagation 阻止事件冒泡
    // stopImmediatePropagation 阻止事件冒泡并阻止后续事件处理
    // preventDefault 阻止默认行为
    // stopPropagation 阻止事件冒泡
    // stopImmediatePropagation 阻止事件冒泡并阻止后续事件处理
    
  </script>
</body>
</html>
