<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机轮播图</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .slider {
      width: 560px;
      height: 400px;
      overflow: hidden;
    }

    .slider-wrapper {
      width: 100%;
      height: 320px;
    }

    .slider-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slider-footer {
      height: 80px;
      background-color: rgb(100, 67, 98);
      padding: 12px 12px 0 12px;
      position: relative;
    }

    .slider-footer .toggle {
      position: absolute;
      right: 0;
      top: 12px;
      display: flex;
    }

    .slider-footer .toggle button {
      margin-right: 12px;
      width: 28px;
      height: 28px;
      appearance: none;
      border: none;
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .slider-footer .toggle button:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .slider-footer p {
      margin: 0;
      color: #fff;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .slider-indicator {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      align-items: center;
    }

    .slider-indicator li {
      width: 8px;
      height: 8px;
      margin: 4px;
      border-radius: 50%;
      background-color: #fff;
      opacity: 0.4;
      cursor: pointer;
    }

    .slider-indicator li.active {
      width: 12px;
      height: 12px;
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="slider">
    <div class="slider-wrapper">
      <img src="" alt="">
    </div>
    <div class="slider-footer">
      <p>第一条文案</p>
      <ul class="slider-indicator">
        <li class="active"></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
      <div class="toggle">
        <button class="prev">&lt;</button>
        <button class="next">&gt;</button>
      </div>
    </div>
  </div>

  <script>
    // 初始数据
    const sliderData = [
      { url: '../03-现代网页布局/img/cat1.jpg', title: '第一条文案', color: 'green' },
      { url: '../03-现代网页布局/img/cat2.jpg', title: '第二条文案', color: 'red' },
      { url: '../03-现代网页布局/img/cat3.jpg', title: '第三条文案', color: 'blue' },
      { url: '../03-现代网页布局/img/cat4.jpg', title: '第四条文案', color: 'yellow' },
    ]
    // 随机数
    // const random = parseInt(Math.random() * sliderData.length)
    // img.src = sliderData[random].url
    // p.innerHTML = sliderData[random].title
    // const footer = document.querySelector('.slider-footer')
    // footer.style.backgroundColor = sliderData[random].color
    // const indicator = document.querySelector(`.slider-indicator li:nth-child(${random + 1})`)
    // indicator.classList.add('active')
    
    
    // const img = document.querySelector('.slider-wrapper img')
    // const p = document.querySelector('.slider-footer p')
    // let i = 0
    // setInterval(function () {
    //   i++
    //   if (i >= sliderData.length - 1) {  // 超出范围，重置为0
    //     i = 0
    //   }
    //   img.src = sliderData[i].url
    //   p.innerHTML = sliderData[i].title
    //   // 只让当前活动的指示器有active类名，其他都去掉active类名
    //   document.querySelector(`.slider-indicator .active`).classList.remove('active')
    //   document.querySelector(`.slider-indicator li:nth-child(${i + 1})`).classList.add('active')
    // }, 1000)


    const img = document.querySelector('.slider-wrapper img')
    const p = document.querySelector('.slider-footer p')
    const footer = document.querySelector('.slider-footer')
    const slider = document.querySelector('.slider')
    function toggle () {
      img.src = sliderData[i].url
      p.innerHTML = sliderData[i].title
      footer.style.backgroundColor = sliderData[i].color
      document.querySelector(`.slider-indicator .active`).classList.remove('active')
      document.querySelector(`.slider-indicator li:nth-child(${i + 1})`).classList.add('active')
    }
    let i = 0
    const next = document.querySelector('.next')
    next.addEventListener('click', function () {
      i++
      if (i > sliderData.length - 1) {  
        i = 0
      }
      toggle()
    })
    const prev = document.querySelector('.prev')
    prev.addEventListener('click', function () {
      i--
      if (i < 0) {
        i = sliderData.length - 1
      }
      toggle()
    })

    let timer = setInterval(function () {
      next.click()
    }, 1000)
    slider.addEventListener('mouseenter', function () {
      clearInterval(timer)
    })
    slider.addEventListener('mouseleave', function () {
      timer = setInterval(function () {
        next.click()
      }, 1000)
    })

  </script>

</body>

</html>
