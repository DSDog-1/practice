<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全选案例</title>
</head>
<body>
  <input type="checkbox" id="checkAll">
  <label for="checkAll">全选</label>
  <input type="checkbox" id="item1" class="item">
  <label for="item1">项目1</label>
  <input type="checkbox" id="item2" class="item">
  <label for="item2">项目2</label>
  <input type="checkbox" id="item3" class="item">
  <label for="item3">项目3</label>

  <script>
    const checkAll = document.querySelector('#checkAll')
    const items = document.querySelectorAll('.item')
    checkAll.addEventListener('click', function () {
      // 遍历小复选框
      for(let i = 0; i < items.length; i++) {
        items[i].checked = this.checked
      }
    })
    // 监听小复选框的点击事件
    for(let i = 0; i < items.length; i++) {
      items[i].addEventListener('click', function () {
        // 遍历小复选框
        checkAll.checked = document.querySelectorAll('.item:checked').length === items.length
        })
      }
  </script>
</body>
</html>
