<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息统计表完全版</title>
</head>

<body>
  <h1>新增学生</h1>
  <form class="info" autocapitalize="off">
    <label for="name">姓名：</label>
    <input type="text" class="name" name="uname">
    <label for="age">年龄：</label>
    <input type="number" class="age" name="age">
    <label for="gender">性别：</label>
    <select class="gender" name="gender">
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    <input type="submit" value="提交">
    <div class="count">共有数据 0 条</div>
    <h1>学生列表</h1>
    <table>
      <thead>
        <tr>
          <th>序号</th>
          <th>姓名</th>
          <th>年龄</th>
          <th>性别</th>
          <th>录入时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </form>
  <script>
    const arr = JSON.parse(localStorage.getItem('arr')) || []
    const tbody = document.querySelector('tbody')
    const count = document.querySelector('.count')
    const info = document.querySelector('.info')

    // 渲染表格
    function render() {
      tbody.innerHTML = arr.map(function (ele, index) {
        return `
      <tr>
        <td>${ele.stuId}</td>
        <td>${ele.uname}</td>
        <td>${ele.age}</td>
        <td>${ele.gender}</td>
        <td>${ele.time || ''}</td>
        <td>
          <a href="#" data-id="${index}">删除</a>
        </td>
      </tr>
      `
      }).join('')
      // 更新条数
      count.innerHTML = `共有数据 ${arr.length} 条`
      // 所有变更后统一持久化
      localStorage.setItem('arr', JSON.stringify(arr))
    }
    render()

    const uname = document.querySelector('.name')
    const age = document.querySelector('.age')
    const gender = document.querySelector('.gender')

    // 提交表单
    info.addEventListener('submit', function (e) {
      e.preventDefault()
      if (!uname.value || !age.value || !gender.value) {
        alert('请填写完整信息')
        return
      }
      arr.push({
        stuId: arr.length ? Math.max(...arr.map(item => item.stuId)) + 1 : 1,
        uname: uname.value,
        age: age.value,
        gender: gender.value,
        time: new Date().toLocaleString()
      })
      this.reset()
      render()
    })

    // 删除学生
    tbody.addEventListener('click', function (e) {
      if (e.target.tagName !== 'A') return
      e.preventDefault()
      const index = Number(e.target.dataset.id)
      arr.splice(index, 1)
      render()
      localStorage.setItem('arr', JSON.stringify(arr))
    })
  </script>
