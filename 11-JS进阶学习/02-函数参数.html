<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>函数参数</title>
</head>
<body>
  <script>
    function getSum() {
      let sum = 0
      for (let i = 0; i < arguments.length; i++) {
        sum += arguments[i]
      }
      return sum
    }

    // 剩余参数
    function getSum2(...a) {
      let sum = 0
      for (let i = 0; i < a.length; i++) {
        sum += a[i]
      }
      return sum
    }
    console.log(getSum2(1, 2, 3, 4, 5))
  </script>
</body>
</html>
