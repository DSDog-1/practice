<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>渲染</title>
</head>
<body>
  <div class = "filter">
    <a href="#" data-id="1">0-100</a>
    <a href="#" data-id="2">100-200</a>
    <a href="#" data-id="3">200-300</a>
  </div>
  <div class="list">
    
  </div>

  <script>
    const goodlist = {
      id: 123,
      name: '商品1',
      price: 1456,
      picture: ''
    }

    function render(arr) {
      // 字符串拼接
      let str = ''
      // 遍历对象
      arr.forEach(item => {
        const { name, price, picture} = item
        str += `<div class="item">
        <img src="${picture}" alt="">
        <p class="name">${name}</p>
        <p class="price">${price}</p> 
      </div>`
      })
      // 渲染到页面
      document.querySelector('.list').innerHTML = str
    }
    render(goodlist)

    // 过滤筛选
    document.querySelector('.filter').addEventListener('click', e => {
      const { tagName, dataset } = e.target
      if(tagName === 'A') {
        // console.log(dataset.id)
        let arr = goodlist
        if (dataset.id === '1') {
          arr = goodlist.filter(item => item.price >= 0 && item.price <= 100)
        } else if (dataset.id === '2') {
          arr = goodlist.filter(item => item.price >= 100 && item.price <= 200)
        } else if (dataset.id === '3') {
          arr = goodlist.filter(item => item.price >= 200 && item.price <= 300)
        }
        render(arr)
      }
    })
  </script>
</body>
</html>
