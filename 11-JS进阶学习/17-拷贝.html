<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拷贝</title>
</head>
<body>
  <div id="time"></div>
  <script src="lodash.min.js"></script>
  <script>
    // 浅拷贝
    const obj = {
      name: '张三',
      age: 18,
      sex: '男'
    }
    // 1. 扩展运算符
    const obj2 = {...obj}
    console.log(obj2)
    // 2. Object.assign()
    const obj3 = {}
    Object.assign(obj3, obj)
    console.log(obj3)

    // function getTime() {
    //   document.querySelector('#time').innerHTML = new Date().toLocaleString()
    //   setTimeout(getTime, 1000)
    // }
    // getTime()

    // 深拷贝
    // 1. 递归
    const obj4 = {}
    function deepCopy(newObj, oldObj) {
      for (let key in oldObj) {
        if(oldObj[key] instanceof Array) {
          newObj[key] = []    // 先写数组
          deepCopy(newObj[key], oldObj[key])
        } else if (oldObj[key] instanceof Object) {
          newObj[key] = {}    // 后写对象
          deepCopy(newObj[key], oldObj[key])
        } else {
          newObj[key] = oldObj[key]
        }
      }
    }
    deepCopy(obj4, obj)
    console.log(obj4)
    // 2.lodash
    const obj5 = _.cloneDeep(obj)
    console.log(obj5)
    // 3. JSON.stringify() + JSON.parse()
    const obj6 = JSON.parse(JSON.stringify(obj))
    console.log(obj6)
  </script>
</body>
</html>
