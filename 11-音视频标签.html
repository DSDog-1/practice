<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音视频标签</title>
</head>
<body>
  <h2>
    视频标签
  </h2>
  <!--<video src="./media/1.mp4" width="400" controls="controls"></video>-->
  <!-- 自动播放、静音、循环播放 -->
  <video src="./media/1.mp4" width="400" controls muted loop poster="./media/fengxiao.jpg"></video>
  <video src="./media/1.mp4" width="400" controls autoplay muted loop poster="./media/fengxiao.jpg"></video>
  <!--兼容性写法-->
  <video width="400" controls >
    <source src="./media/1.mp4" type="video/mp4">
    <p>您的浏览器不支持视频播放</p>
  </video>
  <h2>
    音频标签
  </h2>
  <!--不能自动播放--> 
  <audio src="./media/Rubia.mp3" controls ></audio>
  <!--兼容性写法-->
  <audio width="400" controls >
    <source src="./media/Rubia.mp3" type="audio/mp3">
    <p>您的浏览器不支持音频播放</p>
  </audio>
</body>
</html>
