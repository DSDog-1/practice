<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XHR</title>
</head>

<body>
  <div class="container">
    <!-- <h1>省份列表</h1> -->
    <h2>城市列表：</h2>
    <p class="my-c"></p>
  </div>
  <button id="queryBtn">注册</button>
  <script>
    const p = new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest()
      xhr.open('GET', 'https://hmajax.itheima.net/api/city?pname=辽宁省')
      xhr.addEventListener('loadend', () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          const res = JSON.parse(xhr.response)
          // 业务层也要判断：list 为空说明参数错了
          if (res.list && res.list.length > 0) {
            resolve(res)
          } else {
            reject(new Error(res.message || '请求失败'))
          }
        } else {
          reject(new Error('请求失败，状态码：' + xhr.status))
        }
      })
      xhr.send()
    })
    p.then(res => {
      console.log(res)
      document.querySelector('.my-c').innerHTML = res.list.join('<br>')
    }).catch(err => {
      console.dir(err)
      document.querySelector('.my-c').innerHTML = err.message
    })
