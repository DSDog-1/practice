<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>封装axios请求</title>
</head>

<body>
  <div class="container">
    <h2>区域列表：</h2>
    <p class="my-c"></p>
  </div>
  <script>
    function myAxios(config) {    // 设置接收对象
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest()
        if (config.params) {  // 有参数转换为查询字符串
          config.url = config.url + '?' + new URLSearchParams(config.params).toString()
        }
        xhr.open(config.method || 'GET', config.url)  // 默认GET
        xhr.addEventListener('loadend', () => {
          if (xhr.status >= 200 && xhr.status < 300) {    // 成功状态码
            resolve(JSON.parse(xhr.response))
          } else {
            reject(new Error(xhr.response))
          }
        })
        if (config.data) {  // 有数据时，设置请求头
          xhr.setRequestHeader('Content-Type', 'application/json')
          xhr.send(JSON.stringify(config.data))
        } else {
          xhr.send()
        }
      })
    }
    // 测试
    myAxios({
      url: 'https://hmajax.itheima.net/api/area',
      params: {
        pname: '辽宁省',
        cname: '锦州市'
      }
    }).then(res => {
      console.log(res)
      document.querySelector('.my-c').innerHTML = res.list.join('<br>')
    }).catch(err => {
      console.dir(err)
      document.querySelector('.my-c').innerHTML = err.message
    })
  </script>
</body>

</html>
