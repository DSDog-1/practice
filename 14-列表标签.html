<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列表标签</title>
</head>
<body>
  <h2>
    一、无序列表
  </h2>
  <h3>优秀学生代表</h3>
  <ul>
    <li>郭奉孝</li>
    <li>贾文和</li>
    <li>荀文若</li>
  </ul>
  <h2>
    二、有序列表
  </h2>
  <h3>优秀教职工代表</h3>
  <ol>
    <li>陈公台</li>
    <li>孔文举</li>
    <li>荀公达</li>
  </ol>
  <h2>
    三、描述列表（自定义列表）
  </h2>
  <h3>欢迎报考辟雍学宫</h3>
  <dl>
    <dt>报考信息</dt>
    <dd>姓名</dd>
    <dd>年龄</dd>
    <dd>性别</dd>
  </dl>
</body>
</html>
