<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表格标签</title>
</head>
<body>
  <h2>表格标签的基本语法</h2>
  <table border="1">
    <tr>
      <td>姓名</td>
      <td>年龄</td>
      <td>成绩</td>
    </tr>
    <tr>
      <td>郭奉孝</td>
      <td>18</td>
      <td>93</td>
    </tr>
    <tr>
      <td>贾文和</td>
      <td>18</td>
      <td>95</td>
    </tr>
    <tr>
      <td>荀文若</td>
      <td>19</td>
      <td>98</td>
    </tr>
    <!-- th表头单元格 加粗居中 -->
    
  </table>
  <br>
    <table border="1">
    <tr>
      <th>姓名</th>
      <th>年龄</th>
      <th>成绩</th>
    </tr>
    <tr>
      <td>郭奉孝</td>
      <td>18</td>
      <td>93</td>
    </tr>
    <tr>
      <td>贾文和</td>
      <td>18</td>
      <td>95</td>
    </tr>
    <tr>
      <td>荀文若</td>
      <td>19</td>
      <td>98</td>
    </tr>
  </table>
  <br>
  <h2>表格结构标签</h2>
      <table border="1">
      <thead>
        <tr>
          <th>姓名</th>
          <th>年龄</th>
          <th>成绩</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>郭奉孝</td>
          <td>18</td>
          <td>93</td>
        </tr>
        <tr>
          <td>贾文和</td>
          <td>18</td>
          <td>95</td>
        </tr>
        <tr>
          <td>荀文若</td>
          <td>19</td>
          <td>98</td>
        </tr>
      </tbody>
  </table>
</body>
</html>
