<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合并单元格</title>
</head>
<body>
  <!-- 合并单元格，以左上为准，跨行合并colspan="2"，跨列合并rowspan="2"，删除多余的单元格 -->
  <table border="1">
    <tr>
      <th>姓名</th>
      <th>年龄</th>
      <th>性别</th>
      <th>爱好</th>
      <th>居住地</th>
    </tr>
    <tr>
      <td>张三</td>
      <td>18</td>
      <td>男</td>
      <td>篮球</td>
      <td>北京</td>
    </tr>
    <tr>
      <td>李四</td>
      <td>18</td>
      <td>男</td>
      <td>足球</td>
      <td rowspan="2">广州</td>
    </tr>
    <tr>
      <td>王五</td>
      <td>19</td>
      <td>男</td>
      <td>跑步</td>
       </tr>
    <tr>
      <td>日期</td>
    </tr>


  </table>
</body>
</html>
